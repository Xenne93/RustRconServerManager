name: Cleanup old container versions
on:
  schedule:
    - cron: '0 0 * * 0'  # elke zondag
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'rustrconservermanager'
          package-type: 'container'
          min-versions-to-keep: 1   # bewaar alleen de laatste
          token: ${{ secrets.GITHUB_TOKEN }}
