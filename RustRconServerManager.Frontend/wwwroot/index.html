<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="theme-color" content="#f97316">
    <meta name="color-scheme" content="dark light">
    <title>Dashboard - Rust RCON Server Manager</title>
    <base href="/" />

    <!-- External fonts load from CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

    <link rel="stylesheet" href="/css/tailwind-output.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" href="/favicon.png" type="image/png">

    <!-- Applies the stored/preferred theme before first paint, to avoid a flash of the
         wrong theme. Must run synchronously in <head>, before Blazor (or anything else)
         has a chance to render. -->
    <script src="/js/theme.js"></script>
</head>

<body id="page-top" class="bg-[rgb(var(--body-bg))] text-slate-200">
<div id="app">
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="tw-spinner" style="width: 40px; height: 40px;"></div>
    </div>
</div>

<div id="blazor-error-ui" style="display: none; background: #1e293b; color: #f87171; padding: 1rem; text-align: center; position: fixed; bottom: 0; width: 100%; z-index: 9999;">
    An unhandled error has occurred.
    <a href="" class="text-orange-400 underline ml-2">Reload</a>
    <a class="text-slate-400 ml-4 cursor-pointer" onclick="this.parentElement.style.display='none'">Dismiss</a>
</div>


<script src="/_framework/blazor.webassembly.js"></script>

<!-- QR Code Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<!-- Chart.js Library for Statistics -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/js/stats-chart.js"></script>

<script>
    // QR Code generation for 2FA
    window.generateQRCode = function (text) {
        const qrcodeElement = document.getElementById("qrcode");
        if (qrcodeElement) {
            qrcodeElement.innerHTML = '';
            new QRCode(qrcodeElement, {
                text: text,
                width: 200,
                height: 200,
                colorDark: "#f97316",
                colorLight: "#0f172a",
                correctLevel: QRCode.CorrectLevel.H
            });
        }
    };

    // Pure Blazor modals - no Bootstrap JS needed
    // These are kept for backward compatibility during migration
    window.ShowBootstrapModal = function (modalId) {
        // Noop - modals are now pure Blazor components
        console.log('[Migration] ShowBootstrapModal called for', modalId, '- use TwModal component instead');
    };

    window.HideBootstrapModal = function (modalId) {
        // Noop - modals are now pure Blazor components
        console.log('[Migration] HideBootstrapModal called for', modalId, '- use TwModal component instead');
    };

    // Tab activation - now handled by TwTabs component
    window.activateTab = function (tabId) {
        console.log('[Migration] activateTab called for', tabId, '- use TwTabs component instead');
    };
</script>

<!-- Privacy-friendly analytics by Plausible - only sent when this installation has
     opted in (Panel Settings > Anonymous Usage Statistics). Checked fresh on every page
     load so toggling the setting takes effect immediately, without a rebuild/restart.

     Posts straight to Plausible's Events API instead of loading the official tracking
     script: that script hard-blocks localhost/private-IP hostnames client-side (to stop
     developers polluting their own stats while building a site), but a huge share of
     self-hosted installs are opened via exactly that - http://localhost:port or a bare
     LAN IP - on the very machine running the panel. The Events API itself has no such
     restriction (confirmed directly against telemetry.xenne.eu), so calling it ourselves
     is the only way to actually count those installs. -->
<script>
    fetch('/api/panelsettings/analytics-status')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
            if (data && data.enabled) sendPlausibleEvent('pageview');
        })
        .catch(function () { });

    function sendPlausibleEvent(name, props) {
        try {
            fetch('https://telemetry.xenne.eu/api/event', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    url: location.href,
                    domain: 'rustrconservermanager.xenne.eu',
                    props: props || undefined
                })
            }).catch(function () { });
        } catch (e) { }
    }

    // Called by the authenticated app - it checks analytics-status itself (via the
    // backend, authoritatively) before ever calling this, so no need to re-check here.
    // Aggregate counts only - no SteamIDs, emails, or other identifiable data.
    window.sendAnalyticsSnapshot = function (players, servers, users) {
        sendPlausibleEvent('server-stats', { players: players, servers: servers, users: users });
    };
</script>
</body>

</html>
